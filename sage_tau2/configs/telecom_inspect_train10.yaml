# Skill-only inspect: 10 train tasks, 1 segment, freeze org.
# Look at segment_001/trajectories.json, new_skills.json, skill_bank.json.

domain: telecom-workflow
model: openai/gemini-2.5-flash
user_model: openai/gemini-2.5-flash

task_split_name: train
allow_task_resampling: false
balance_difficulty: true
segment_size: 10
num_segments: 1
seed: 42
max_concurrency: 2

val_size: 0
seed_skills: false
max_inject_skills: 2
allow_provisional_inject: true
freeze_organization: true
inject_same_domain_only: true

min_support: 1
require_success: true
min_protocol_len: 1
max_new_skills: 12
verify_score: 0.5
prune_score: 0.2
min_protocol_coverage: 0.5
min_support_for_verified: 5

dump_pro_trajectories: true
agent_name: sage_tau2
