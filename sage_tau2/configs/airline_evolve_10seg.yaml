# SAGE-τ² airline evolve — aligned with sage_mas online600_noseed.
#
# 10 segments × 60 tasks (=600).
# Default org path = OrganizationEditor-style ADD → probation → onboarding
# (Spec-vs-Exec / actor_promotion_probe OFF).
# airline task pool ≈50; num_tasks=60 resamples with a per-segment seed.

# 10 segments × 60 tasks — legacy resampling (train pool airline=30).
allow_task_resampling: true
task_split_name: train

domain: airline
model: openai/gemini-2.5-flash
user_model: openai/gemini-2.5-flash
segment_size: 60
num_segments: 10
seed: 42
max_concurrency: 3
max_inject_skills: 2
allow_provisional_inject: true
freeze_organization: false

min_support: 1
require_success: true
min_protocol_len: 1
max_new_skills: 16
verify_score: 0.60
prune_score: 0.20
min_protocol_coverage: 0.5

cluster_novelty_threshold: 0.05
nominate_min_cluster_support: 1
nominate_min_utility: 0.0
max_new_agents_per_round: 1
dispatch_only_new_agents: true
probation_games: 3
allow_provisional_org_edits: false
require_same_domain_for_nominate: true
no_spec_mode: editor_commit

# Match actor_promotion_probe: false
enable_spec_vs_exec: false
admit_num_tasks: 8
admit_min_advantage: 0.0
admit_accept_ties: false
admit_on_fail_action: remove
admit_min_utility: 0.60
admit_min_support: 3

# Onboarding (probation_min_games / probation_min_wins)
probation_min_games: 3
probation_min_wins: 2
remove_after_rejected_windows: 2

agent_name: sage_tau2
