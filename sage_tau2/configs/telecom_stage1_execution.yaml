# Fresh runs only: these three configs share tasks, seed, model and validation.
domain: telecom
model: openai/gemini-2.5-flash
user_model: openai/gemini-2.5-flash
task_split_name: train_large
val_split_name: val_large
segment_size: 10
num_segments: 5
val_size: 10
val_exclude_from_train: true
seed: 42
max_concurrency: 4
allow_task_resampling: false
balance_difficulty: true
seed_skills: false
retry_write_fails: false
retry_verdict_feedback: false
require_success: true
min_support: 2
min_protocol_len: 2
min_support_for_verified: 3
max_new_skills: 12
allow_provisional_inject: true
credit_per_episode_inject: true
select_skills: true
max_delegated_turns: 8
dump_pro_trajectories: true
dump_val_pro_trajectories: true
agent_name: sage_tau2
max_inject_skills: 0
freeze_organization: true
enable_executor_dispatch: false
enable_delegation: false
enable_spec_vs_exec: false
