# Telecom evolve 5×20 on train_large — bootstrap-seed run.
#
# Difference vs telecom_seg20_x5_coarse.yaml:
#   1. seed_skills points at sage_tau2/seed_banks/telecom_bootstrap_seed.json —
#      two skills distilled by SAGE's own pipeline (n=9 roaming from the main
#      run, refuel_data from the rescued probe win), re-labeled and frozen as
#      VERIFIED seeds. No hand-written protocol content.
#   2. retry_write_fails: one verdict-feedback retry on write-gold fails, to
#      rescue wrong-line near-misses (L1001 vs L1002) so distillation can
#      accumulate refuel_data support online.
#   3. Requires the zombie-specialist cascade fix (pipeline heal +
#      capability-fallback dispatch) so retired skill refs cannot zero a
#      specialist's eligibility.
#
# cd ~/verl-agent/tau2-bench
# PYTHONPATH=.. uv run python -m sage_tau2.runners.online_tau2 \
#   --config ../sage_tau2/configs/telecom_seg20_x5_bootseed.yaml \
#   --output ../logs/sage_tau2/telecom_seg20_x5_bootseed \
#   --llm-config ../examples/prompt_agent/llm_config.yaml

domain: telecom
model: openai/gemini-2.5-flash
user_model: openai/gemini-2.5-flash

task_split_name: train_large
allow_task_resampling: false
balance_difficulty: true
segment_size: 20
num_segments: 5
seed: 42
max_concurrency: 8

val_size: 50
val_split_name: val_large
val_exclude_from_train: true
dump_val_pro_trajectories: true

seed_skills: ../sage_tau2/seed_banks/telecom_bootstrap_seed.json
max_inject_skills: 2
allow_provisional_inject: true
freeze_organization: false
inject_same_domain_only: true

# Verdict-feedback retry on write-gold fails (rescues wrong-line near-misses).
retry_write_fails: true
retry_k: 1
retry_verdict_feedback: true

min_support: 2
require_success: true
min_protocol_len: 2
max_new_skills: 12
verify_score: 0.5
prune_score: 0.2
# P0 coarse buckets make support accumulate; P1 needs stronger episode match.
min_protocol_coverage: 0.75
min_support_for_verified: 3
# P1 attribution gates (defaults are already true; listed for clarity).
credit_require_full_write_spine: true
credit_per_episode_inject: true

cluster_novelty_threshold: 0.35
nominate_min_cluster_support: 2
nominate_min_utility: 0.4
max_new_agents_per_round: 1
dispatch_only_new_agents: true
probation_games: 3
allow_provisional_org_edits: false
require_same_domain_for_nominate: true
no_spec_mode: editor_commit

enable_spec_vs_exec: true
admit_num_tasks: 6
admit_min_advantage: 0.05
admit_accept_ties: false
admit_on_fail_action: remove
admit_min_utility: 0.45
admit_min_support: 2

probation_min_games: 2
probation_min_wins: 1
remove_after_rejected_windows: 2
probation_primary_quota: 0

dump_pro_trajectories: true
agent_name: sage_tau2
