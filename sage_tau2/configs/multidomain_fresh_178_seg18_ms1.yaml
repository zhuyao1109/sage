# Cold-start multi-domain evolve (178 train, 18×10) — aligned gates + mid-length segments.
#
# Changes vs multidomain_fresh_178_aligned.yaml:
#   - segment_size=18, num_segments=10 (178 train without resampling; last seg partial)
#   - min_support=1 (birth on single success; bank merges duplicates across segments)
#
# Segment protocol (online_multidomain):
#   1) collect all domains with inject = prior-segment same-domain skills only
#   2) distill + cluster per domain
#   3) after all domains: nominate/admit (Spec capability-scoped)
#   Seg1 inject pool is empty → pure Executor collect + distill.
#
# Keeps aligned quality path:
#   - Spec-vs-Exec ON with capability-scoped probe (admission_probe.py)
#   - novelty 0.35, nominate utility 0.5, no provisional org edits
#   - probation_primary_quota=0
#
# Per-segment quotas ≈ airline:retail:telecom = 3:7:8 (or 3:8:7)

model: openai/gemini-2.5-flash
user_model: openai/gemini-2.5-flash
seed: 42
max_concurrency: 6
max_inject_skills: 2
allow_provisional_inject: true
freeze_organization: false
inject_same_domain_only: true

segment_size: 18
num_segments: 10
task_split_name: train
allow_task_resampling: false
domain_weights:
  airline: 30
  retail: 74
  telecom: 74

# Distill: allow single-success birth; credit + cluster support still gate nominate
min_support: 1
require_success: true
min_protocol_len: 2
max_new_skills: 12
verify_score: 0.60
prune_score: 0.20
min_protocol_coverage: 0.50

cluster_novelty_threshold: 0.35
nominate_min_cluster_support: 2
nominate_min_utility: 0.50
max_new_agents_per_round: 1
dispatch_only_new_agents: true
probation_games: 3
allow_provisional_org_edits: false
require_same_domain_for_nominate: true
no_spec_mode: editor_commit

enable_spec_vs_exec: true
admit_num_tasks: 6
admit_min_advantage: 0.0
admit_accept_ties: false
admit_on_fail_action: remove
admit_min_utility: 0.60
admit_min_support: 2

probation_min_games: 3
probation_min_wins: 2
remove_after_rejected_windows: 2
probation_primary_quota: 0

agent_name: sage_tau2
