# ALFWorld small evolution run: 10 segments x 6 train games = 60.
# Start with one Executor and an empty SkillBank.
# Distill with at least 2 successful trajectories per capability;
# evidence includes the current segment and up to 2 prior segments.
# Validate after each segment on the same 12 valid_unseen tasks (2 per family).
# 60 train episodes + 120 validation episodes; separate test remains disabled.

sage:
  allow_provisional_org_edits: false
  seed_organization_path: null
  seed_skill_bank_path: null
  redundancy_threshold: 0.90
  disable_merge: true

  distillation:
    mode: heuristic
    llm_protocol_overlay: true
    model: gemini-2.5-flash
    temperature: 0.0
    max_completion_tokens: 8192
    max_retries: 2
    high_cost_steps: 25
    min_support: 1
    operation_min_support: 1
    min_family_support: 1
    max_evidence_trajectories: 3
    max_steps_per_trajectory: 15
    max_fragments: 5
    min_wins_for_protocol: 2
    exclude_capability_prefixes:
      - "execution."
      - "recovery."
      - "action."
      - "search."
    exclude_signals:
      - efficient_execution
      - progress_checkpoint
      - failure_checkpoint
      - admissible_action_guard
      - stagnation_recovery
      - repetition_guard
      - search_exhaustion
    block_injection_capability_prefixes:
      - "execution."
      - "recovery."
      - "action."
      - "search."
    inject_capability_allowlist:
      - "transform."
      - "track."
      - "inspect."

  clustering:
    enabled: true
    novelty_threshold: 0.05

  skill_credit:
    verify_score: 0.60
    prune_score: 0.20
    min_uses_for_promotion: 1
    min_uses_for_pruning: 3
    require_positive_mu_for_verify: false
    min_marginal_utility: 0.0
    relative_credit_to_baseline: false
    min_protocol_coverage: 0.5
    min_adherence_for_use: 0.34
    min_adherence_for_verify: 0.34
    combine_adherence_with_effect: true
    require_task_win_for_success: false

  # Credit-only path: no student MU / executable bank. Credit-promoted verified
  # skills may enter org clustering; online probation validates specialists.
  skill_transfer:
    require_inject_ready_for_org: false
    require_positive_mu_for_injection: false

  assignment_gap:
    role_weight: 0.7
    tool_weight: 0.3
    empirical_weight: 0.0

  organization:
    distribution_shift_threshold: 0.15
    min_cluster_support: 1
    min_failure_rate: 0.0
    min_assignment_gap: 0.1
    # Cold start: first verified skills can ADD when only Executor exists.
    allow_bootstrap_add: true
    max_bootstrap_agents_per_round: 1
    max_new_agents_per_round: 1
    cluster_by: capability
    # ALFWorld repeats six families; shift alone rarely exceeds 0.15.
    add_when_uncovered_capability: true
    require_executable_bank_for_add_agent: false
    dispatch_only_new_agents: true
    probation_games: 3
    require_executable_protocol: true
    # LLM overlay skills often use action_protocol, not raw trajectory source.
    require_trajectory_executable_protocol: false
    min_protocol_adherence_for_add_agent: 0.34
    require_positive_mu_for_add_agent: false
    min_marginal_utility_for_add_agent: 0.0

  executor_dispatch:
    enabled: true
    allow_dormant: false
    auto_assign_single: true
    require_accepted_for_primary: true
    prefer_matching_specialist: true
    probation_primary_quota: 8

  shadow:
    enabled: false

  online:
    num_games: 60
    collection_dataset: train
    segment_size: 6
    parallel_envs: 6
    api_concurrency: 6
    llm_timeout: 90
    llm_max_retries: 1
    game_selection: family_proportional
    seed: 1
    temperature: 0.0
    executor_model: gemini-2.5-flash
    specialist_model: gemini-2.5-flash
    acceptor_model: gemini-2.5-flash
    max_skills_per_round: 6
    mechanism_dataset: valid_unseen
    skip_shadow: true
    commit_org_on_last_segment: true
    freeze_organization: false
    propose_org_for_unassigned_skills: false
    org_warmup_segments: 1
    actor_promotion_probe: false
    ignore_assigned_skills: false
    max_advisors: 0
    max_injected_skills: 2
    save_steps: true
    distill_after_last_segment: true
    stop_when_no_candidates: false
    gate_injected_skills: true
    gate_assigned_skills: true
    use_visited_location_memory: false
    # Training: exploration bias lets new skills accumulate credit data.
    # The final 134-game test runs separately with prefer_proven_skills: true.
    prefer_proven_skills: false
    require_positive_mu_for_injection: false
    min_marginal_utility: 0.0
    paired_mu_probe: false
    paired_mu_num_tasks: 2
    paired_mu_require_ci: false
    run_control_eval_for_credit: false
    probation_min_games: 3
    probation_min_wins: 2
    probation_epsilon: 0.0
    remove_after_rejected_windows: 2
    distill_prior_segments: 2
    block_injection_capability_prefixes:
      - "execution."
      - "recovery."
      - "action."
      - "search."
    inject_capability_allowlist:
      - "transform."
      - "track."
      - "inspect."
    val_eval:
      enabled: true
      every_segment: true
      pool_size: 12
      dataset: valid_unseen
      game_selection: family_proportional
    # A separate final test should exclude the fixed 12-task validation pool.
    test_eval:
      enabled: false
      every_segment: false
      every_n_segments: 0
      pool_size: 134
      dataset: valid_unseen
      only_after_add_agent: false
      model: gemini-2.5-flash
      parallel_envs: 24
      api_concurrency: 24

  skill_lifecycle:
    retire_after_negative: 0
    negative_utility_threshold: 0.0
    negative_utility_decay: 0.5

  agents:
    - name: "Executor"
      role: "Environment executor and coordinator"
      role_specification: "Interpret observations, retrieve applicable skills, and execute admissible ALFWorld actions. Coordinate eligible specialists for bounded subtasks."
      responsibility_boundary: "Own task completion and verify progress from environment feedback after each action."
      responsibilities:
        - "Interpret ALFWorld observations and select admissible actions"
        - "Select applicable skills and coordinate eligible specialists"
      assigned_skills: []
      tool_permissions:
        - "alfworld_action"
      activation_condition: "Always active during environment interaction."
      input_protocol: "Input: ALFWorld observations, task, and execution state."
      output_protocol: "Output exactly one <think>...</think><action>admissible action</action> decision."
      communication_edges: []
      token_budget: null
      turn_budget: null
      retirement_condition: null
      shadow_evaluation_record:
        status: "baseline"

  enable_action_guards: false
  compact_alfworld_prompts: false
