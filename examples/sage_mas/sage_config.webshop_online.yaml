# SAGE online WebShop evolution (skills + optional org).
#
#   PYTHONUNBUFFERED=1 python -m sage_mas.runners.online_webshop \
#     --llm-config examples/prompt_agent/llm_config.yaml \
#     --sage-config examples/sage_mas/sage_config.webshop_online.yaml \
#     --output logs/sage_mas/webshop_online

sage:
  trajectory_adapter: webshop
  allow_provisional_org_edits: false
  skill_bank_path: null
  redundancy_threshold: 0.90

  distillation:
    mode: heuristic
    high_cost_steps: 25
    min_support: 1
    operation_min_support: 1
    min_family_support: 1
    max_evidence_trajectories: 3
    max_steps_per_trajectory: 15
    max_fragments: 5

  skill_credit:
    verify_score: 0.60
    prune_score: 0.20
    min_uses_for_promotion: 1
    min_uses_for_pruning: 3
    min_protocol_coverage: 0.5
    min_adherence_for_use: 0.34
    require_task_win_for_success: false

  assignment_gap:
    role_weight: 0.7
    tool_weight: 0.3
    empirical_weight: 0.0

  organization:
    distribution_shift_threshold: 0.15
    min_cluster_support: 1
    min_failure_rate: 0.0
    min_assignment_gap: 0.1
    allow_bootstrap_add: false
    max_bootstrap_agents_per_round: 0
    max_new_agents_per_round: 1
    prefer_assign_before_add: true
    cluster_by: capability
    dispatch_only_new_agents: true
    probation_games: 3
    require_executable_protocol: true
    require_trajectory_executable_protocol: true

  executor_dispatch:
    enabled: true
    allow_dormant: false
    auto_assign_single: true
    require_accepted_for_primary: true
    prefer_matching_specialist: true
    probation_primary_quota: 8

  shadow:
    enabled: false

  online:
    # Stratified coverage (sum=50): fashion lowered to 18 so minority cats stay visible.
    num_games: 50
    collection_dataset: train
    segment_size: 50
    parallel_envs: 4
    api_concurrency: 4
    max_steps: 50
    llm_timeout: 120
    llm_max_retries: 2
    game_selection: category_stratified
    category_quotas:
      fashion: 18
      garden: 20
      beauty: 4
      electronics: 4
      grocery: 4
    seed: 1
    temperature: 0.0
    max_skills_per_round: 3
    mechanism_dataset: test
    shadow_pool_size: 0
    skip_shadow: true
    commit_org_on_last_segment: true
    executor_only: false
    freeze_organization: false
    ignore_assigned_skills: false
    max_advisors: 0
    max_injected_skills: 2
    save_steps: true
    distill_after_last_segment: true
    stop_when_no_candidates: false
    gate_injected_skills: true
    gate_assigned_skills: true
    use_visited_location_memory: false
    enable_action_guards: false
    paired_mu_probe: false
    actor_promotion_probe: false
    org_warmup_segments: 1
    distill_prior_segments: 2
    probation_min_games: 3
    probation_min_wins: 2
    probation_epsilon: 0.0
    remove_after_rejected_windows: 2
    val_eval:
      enabled: false
    test_eval:
      enabled: false

  skill_lifecycle:
    negative_utility_threshold: 0.0
    negative_utility_decay: 0.5
    retire_after_negative: 0

  agents:
    - name: "Executor"
      role: "Environment executor"
      role_specification: "Primary WebShop actor. May dispatch specialists when their capability contracts match the shopping task."
      responsibility_boundary: "In scope: observation interpretation, action selection, specialist dispatch. Out of scope: inventing unavailable UI actions."
      responsibilities:
        - "Interpret WebShop text observations"
        - "Select search[query] or click[button] actions"
        - "Dispatch specialists when contracts match"
      assigned_skills: []
      tool_permissions:
        - "webshop_action"
        - "search"
        - "click"
      activation_condition: "Always active during environment interaction."
      input_protocol: "Input: WebShop observation template with available actions."
      output_protocol: "Output exactly one <think>...</think><action>search[...] or click[...]</action> decision."
      communication_edges: []
      token_budget: 512
      turn_budget: null
      retirement_condition: null
      shadow_evaluation_record:
        status: "baseline"

  enable_action_guards: false
  compact_alfworld_prompts: false
