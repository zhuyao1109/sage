# F5: SAME S1 skills as F1, but multi-agent org (specialists + dispatch).
# First build org/bank via build_pro_coldstart_seed_org.py (see README).

sage:
  allow_provisional_org_edits: false
  skill_bank_path: null
  redundancy_threshold: 0.90
  distillation:
    mode: heuristic
    min_support: 1
    operation_min_support: 1
    min_family_support: 1
  skill_credit:
    verify_score: 0.60
    prune_score: 0.20
  assignment_gap:
    role_weight: 0.7
    tool_weight: 0.3
    empirical_weight: 0.0
  organization:
    distribution_shift_threshold: 0.15
    min_cluster_support: 999
    allow_bootstrap_add: false
    max_bootstrap_agents_per_round: 0
    max_new_agents_per_round: 0
  shadow:
    enabled: false
  seed_organization_path: "logs/sage_mas/ablate_freeze/S1_seed_organization.json"
  seed_skill_bank_path: "logs/sage_mas/ablate_freeze/S1_skill_bank_verified_for_agents.json"
  seed_skill_statuses:
    - verified
  disable_merge: true
  executor_dispatch:
    enabled: true
    allow_dormant: false
    auto_assign_single: true
    prefer_matching_specialist: true
    require_accepted_for_primary: false
  online:
    num_games: 134
    collection_dataset: valid_unseen
    segment_size: 134
    parallel_envs: 32
    api_concurrency: 32
    llm_timeout: 120
    llm_max_retries: 2
    game_selection: first
    seed: 1
    temperature: 0.0
    executor_model: gemini-2.5-flash
    specialist_model: gemini-2.5-flash
    acceptor_model: gemini-2.5-flash
    max_skills_per_round: 0
    skip_shadow: true
    freeze_organization: true
    commit_org_on_last_segment: false
    distill_after_last_segment: false
    stop_when_no_candidates: true
    save_steps: true
    use_visited_location_memory: false
    max_advisors: 0
    executor_only: false
    ignore_assigned_skills: false
    max_injected_skills: 2
    gate_injected_skills: true
    gate_assigned_skills: false
    val_eval:
      enabled: false
    test_eval:
      enabled: false
  agents: []
  enable_action_guards: false
  compact_alfworld_prompts: false
