# M1: evolve MAS without distribution-shift gate; no org MU/shadow.
# Fixed skill bank from S1.

sage:
  allow_provisional_org_edits: false
  skill_bank_path: null
  redundancy_threshold: 0.9
  distillation:
    mode: heuristic
    high_cost_steps: 25
    min_support: 1
    operation_min_support: 1
    min_family_support: 1
    max_evidence_trajectories: 3
    max_steps_per_trajectory: 15
    max_fragments: 5
  skill_credit:
    verify_score: 0.6
    prune_score: 0.2
    min_uses_for_promotion: 1
    min_uses_for_pruning: 3
  assignment_gap:
    role_weight: 0.7
    tool_weight: 0.3
    empirical_weight: 0.0
  organization:
    distribution_shift_threshold: 0.0
    min_cluster_support: 1
    min_failure_rate: 0.0
    min_assignment_gap: 0.0
    allow_bootstrap_add: true
    max_bootstrap_agents_per_round: 1
    max_new_agents_per_round: 1
    cluster_by: capability
    dispatch_only_new_agents: true
    probation_games: 3
    add_when_uncovered_capability: true
  executor_dispatch:
    enabled: true
    allow_dormant: true
    auto_assign_single: false
    prefer_matching_specialist: true
    llm_only_dispatch: false
  shadow:
    enabled: false
    num_tasks: 8
    seed: 202
    temperature: 0.0
    save_steps: true
    max_advisors: 0
    gate_assigned_skills: true
    cost_weight: 0.0
    agent_count_weight: 0.0
    min_relative_gain: 0.0
    bootstrap_samples: 500
    confidence_level: 0.95
    require_confident_gain: false
    min_paired_tasks: 1
  online:
    num_games: 134
    collection_dataset: valid_unseen
    segment_size: 10
    parallel_envs: 16
    api_concurrency: 16
    llm_timeout: 120
    llm_max_retries: 2
    game_selection: first
    seed: 1
    temperature: 0.0
    executor_model: gemini-2.5-flash
    specialist_model: gemini-2.5-flash
    acceptor_model: gemini-2.5-flash
    max_skills_per_round: 0
    mechanism_dataset: valid_seen
    shadow_pool_size: 0
    skip_shadow: true
    commit_org_on_last_segment: true
    executor_only: false
    freeze_organization: false
    ignore_assigned_skills: false
    max_advisors: 4
    max_injected_skills: 2
    save_steps: true
    distill_after_last_segment: false
    stop_when_no_candidates: false
    gate_injected_skills: true
    gate_assigned_skills: true
    use_visited_location_memory: false
    probation_min_games: 3
    probation_min_wins: 2
    probation_epsilon: 0.0
    remove_after_rejected_windows: 2
  skill_lifecycle:
    negative_utility_threshold: 0.0
    negative_utility_decay: 0.5
    retire_after_negative: 0
  agents:
    - name: "Executor"
      role: "Environment executor"
      role_specification: "Sole ALFWorld actor with optional injected skill protocols."
      responsibility_boundary: "In scope: observation interpretation and action selection."
      responsibilities:
        - Interpret ALFWorld observations
        - Select and execute admissible environment actions
        - Follow injected verified skill protocols when preconditions match
      assigned_skills: []
      tool_permissions:
        - alfworld_action
      activation_condition: "Always active during environment interaction."
      input_protocol: "Input: ALFWorld observation template; optional active skill protocols."
      output_protocol: "Output exactly one <think>...</think><action>admissible action</action> decision."
      communication_edges: []
      token_budget: null
      turn_budget: null
      retirement_condition: null
      shadow_evaluation_record:
        status: "baseline"
  enable_action_guards: false
  compact_alfworld_prompts: false
  seed_skill_bank_path: "logs/sage_mas/ablate_skill_S1_creditON_retr/skill_bank.json"
  seed_skill_statuses:
    - verified
    - provisional
